<h1>Лента записей</h1>

{% for post in posts %}
<p><b>Место:</b> {{ post.location }}</p>
<p><b>Дата:</b> {{ post.date }}</p>
<p><b>Категория:</b> {{ post.category }}</p>

<p>{{ post.text|truncatewords:10 }}</p>

<a href="{% url 'blog:post_detail' post.id %}">
    Читать полный текст
</a>
<hr>
{% endfor %}
